services:
  backend:
    build: ./backend
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemma-4-31b-it:free}
      MAX_TOKENS: ${MAX_TOKENS:-1024}
      TEMPERATURE: ${TEMPERATURE:-0.7}
    expose:
      - "8000"
    ports:
      - "8000:8000" # exposed for local debugging / curl; not required by the UI

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
